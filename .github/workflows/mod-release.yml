name: Mod Release

# Builds signed release APKs and publishes them as a GitHub Release.
# - schedule / manual run: merge upstream fcitx5-android first; build only if something changed
# - push to master (e.g. "Sync fork" on the web, or your own commits): build directly

on:
  schedule:
    - cron: "0 3 * * *" # 11:00 Beijing time
  workflow_dispatch:
    inputs:
      force:
        description: Build even if upstream has no new commits
        type: boolean
        default: false
  push:
    branches: [master]
    paths-ignore:
      - "**.md"

permissions:
  contents: write
  actions: write # start Mod Bundle after a release

concurrency:
  group: mod-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fcitx5-android/fcitx5-android.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Upstream has no new commits"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit upstream/master; then
            git merge --abort
            echo "::error::Merge conflict with upstream. Resolve it locally (git fetch upstream && git merge upstream/master), then push."
            exit 1
          fi
          # Pushing changes under .github/workflows needs a PAT; in that case use "Sync fork" on the web
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (needs.sync.result == 'success' &&
        (needs.sync.outputs.changed == 'true' || inputs.force)))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install CMake
        run: sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: ver
        run: |
          base=$(sed -n 's/.*baseVersionName = "\(.*\)".*/\1/p' build-logic/convention/src/main/kotlin/Versions.kt)
          echo "name=${base}-mod.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          BUILD_VERSION_NAME: ${{ steps.ver.outputs.name }}
          BUILD_COMMIT_HASH: ${{ github.sha }}
        run: |
          if [ -z "$SIGN_KEY_BASE64" ]; then
            echo "::error::Secret SIGN_KEY_BASE64 is not set"
            exit 1
          fi
          ./gradlew :app:assembleRelease
          ./gradlew :assembleReleasePlugins

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          notes="自动编译：$(git log -1 --format='%h %s')

          修改内容见 [项目说明](https://github.com/${GITHUB_REPOSITORY}#readme)

          - 只支持 arm64-v8a
          - 包名 org.fcitx.fcitx5.android.mod，可与原版共存
          - 插件需和主程序来自同一个 Release（同一签名）"
          gh release create "v${VERSION}" --target "$(git rev-parse HEAD)" \
            --title "v${VERSION}" --notes "$notes" \
            app/build/outputs/apk/release/*.apk \
            plugin/*/build/outputs/apk/release/*.apk

      - name: Start the all-in-one build
        env:
          GH_TOKEN: ${{ github.token }}
        # Mod Bundle merges master into the all-in-one branch and publishes v<version>-all
        run: gh workflow run mod-bundle.yml --repo "$GITHUB_REPOSITORY" --ref all-in-one || echo "::warning::Could not start Mod Bundle"
